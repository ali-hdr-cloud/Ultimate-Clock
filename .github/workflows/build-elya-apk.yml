name: Build Elya APK

on:
  push:
    branches:
      - elya-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Unpack Elya Android project
        run: |
          rm -rf elya_project
          mkdir -p elya_project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'Elya-Android-APK-Project*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Elya project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d elya_project
          echo "Using $ZIP_FILE"

      - name: Apply Elya 1.0.1 folder scan fix
        working-directory: elya_project
        run: python ../elya-fix/patch_elya_101.py

      - name: Apply Elya 1.0.2 automatic device scan
        working-directory: elya_project
        run: python ../elya-fix/patch_elya_102.py

      - name: Apply Elya 1.0.3 premium UI
        working-directory: elya_project
        run: python ../elya-fix/patch_elya_103.py

      - name: Apply Elya 1.0.4 Firebase accounts
        working-directory: elya_project
        run: python ../elya-fix/patch_elya_104.py

      - name: Apply Elya 1.0.5 Google and phone auth
        working-directory: elya_project
        run: python ../elya-fix/patch_elya_105.py

      - name: Apply Elya 1.0.6 stability fixes
        working-directory: elya_project
        run: python ../elya-fix/patch_elya_106.py

      - name: Enable AndroidX for Firebase
        working-directory: elya_project
        run: |
          if grep -q '^android.useAndroidX=' gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

      - name: Validate patched files
        working-directory: elya_project
        run: |
          grep -q "versionName '1.0.6'" app/build.gradle
          grep -q "com.google.gms.google-services" build.gradle
          grep -q "firebase-auth" app/build.gradle
          grep -q "firebase-firestore" app/build.gradle
          grep -q "googleid:1.1.1" app/build.gradle
          grep -q "deviceScanRunning" app/src/main/java/com/elya/music/MainActivity.java
          grep -q "firebaseEmailSignIn" app/src/main/java/com/elya/music/MainActivity.java
          grep -q "firebaseGoogleSignIn" app/src/main/java/com/elya/music/MainActivity.java
          grep -q "firebasePhoneSendCode" app/src/main/java/com/elya/music/MainActivity.java
          grep -q "firebasePhoneVerifyCode" app/src/main/java/com/elya/music/MainActivity.java
          grep -q "elya106StabilityScript" app/src/main/assets/index.html
          grep -q "Music scan is continuing in the background" app/src/main/assets/index.html
          grep -q '"package_name": "com.elya.music"' app/google-services.json
          grep -q '"client_type": 3' app/google-services.json
          grep -q '^android.useAndroidX=true' gradle.properties
          test -f app/src/main/assets/elya-logo.png

      - name: Validate JavaScript syntax
        working-directory: elya_project
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',h,flags=re.S|re.I)
          Path('/tmp/elya.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/elya.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: elya_project
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare unsigned APK and signing tools
        run: |
          cp elya_project/app/build/outputs/apk/release/app-release-unsigned.apk Elya-1.0.6-unsigned.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android build tools: $BUILD_TOOLS"
          mkdir -p signing-tools/lib
          cp "$BUILD_TOOLS/apksigner" signing-tools/apksigner
          cp "$BUILD_TOOLS/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          chmod +x signing-tools/apksigner
          ls -lh Elya-1.0.6-unsigned.apk signing-tools/apksigner signing-tools/lib/apksigner.jar

      - name: Upload Elya unsigned APK and signer
        uses: actions/upload-artifact@v4
        with:
          name: Elya-APK-1.0.6-unsigned
          path: |
            Elya-1.0.6-unsigned.apk
            signing-tools
          if-no-files-found: error
          retention-days: 30
