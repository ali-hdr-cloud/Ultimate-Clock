name: Build Elya APK

on:
  push:
    branches:
      - elya-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Unpack Elya Android project
        run: |
          rm -rf elya_project
          mkdir -p elya_project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'Elya-Android-APK-Project*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Elya project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d elya_project
          echo "Using $ZIP_FILE"

      - name: Apply Elya patches through 1.1.3
        working-directory: elya_project
        run: |
          for v in 101 102 103 104 105 106 107 108 109 110 111 112 113; do
            echo "Applying patch $v"
            python "../elya-fix/patch_elya_${v}.py"
          done

      - name: Enable AndroidX for Firebase
        working-directory: elya_project
        run: |
          if grep -q '^android.useAndroidX=' gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

      - name: Validate Elya 1.1.3
        working-directory: elya_project
        run: |
          grep -q "versionName '1.1.3'" app/build.gradle
          grep -q "versionCode 14" app/build.gradle
          grep -q "ELYA_NATIVE_CORE_113" app/src/main/java/com/elya/music/MainActivity.java
          grep -q "elya-bridge-1.1.3" app/src/main/java/com/elya/music/MainActivity.java
          grep -q "__elyaPlaybackVersion='1.1.2'" app/src/main/assets/index.html
          grep -q "__elyaTouchVersion='1.1.3'" app/src/main/assets/index.html
          grep -q "DRAG_DEADZONE=24" app/src/main/assets/index.html
          grep -q "interactiveTarget" app/src/main/assets/index.html
          grep -q "elya113TouchSafety" app/src/main/assets/index.html
          grep -q '<audio id="audio" crossorigin="anonymous"' app/src/main/assets/index.html
          grep -q "function songBase(input={})" app/src/main/assets/index.html
          grep -q "deepScanDeviceMusic" app/src/main/java/com/elya/music/MainActivity.java
          grep -q "scanPublicAudioFolders" app/src/main/java/com/elya/music/MainActivity.java
          grep -q "Cross-Origin-Resource-Policy" app/src/main/java/com/elya/music/MainActivity.java
          grep -q '"package_name": "com.elya.music"' app/google-services.json
          grep -q '^android.useAndroidX=true' gradle.properties
          test -f app/src/main/assets/elya-logo.png

      - name: Validate JavaScript syntax
        working-directory: elya_project
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',h,flags=re.S|re.I)
          Path('/tmp/elya.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/elya.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: elya_project
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare unsigned APK and signing tools
        run: |
          cp elya_project/app/build/outputs/apk/release/app-release-unsigned.apk Elya-1.1.3-unsigned.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android build tools: $BUILD_TOOLS"
          mkdir -p signing-tools/lib
          cp "$BUILD_TOOLS/apksigner" signing-tools/apksigner
          cp "$BUILD_TOOLS/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          chmod +x signing-tools/apksigner
          ls -lh Elya-1.1.3-unsigned.apk signing-tools/apksigner signing-tools/lib/apksigner.jar

      - name: Upload Elya unsigned APK and signer
        uses: actions/upload-artifact@v4
        with:
          name: Elya-APK-1.1.3-unsigned
          path: |
            Elya-1.1.3-unsigned.apk
            signing-tools
          if-no-files-found: error
          retention-days: 30
