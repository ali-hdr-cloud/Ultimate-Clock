name: Build Elya APK

on:
  push:
    branches:
      - elya-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Unpack Elya Android project
        run: |
          rm -rf elya_project
          mkdir -p elya_project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'Elya-Android-APK-Project*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Elya project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d elya_project
          echo "Using $ZIP_FILE"

      - name: Apply Elya 1.0.1 folder scan fix
        working-directory: elya_project
        run: python ../elya-fix/patch_elya_101.py

      - name: Validate patched files
        working-directory: elya_project
        run: |
          grep -q "versionName '1.0.1'" app/build.gradle
          grep -q "__elyaNativeScanProgress" app/src/main/assets/index.html
          grep -q "extractorDurationMs" app/src/main/java/com/elya/music/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: elya_project
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp elya_project/app/build/outputs/apk/debug/app-debug.apk Elya-1.0.1.apk
          ls -lh Elya-1.0.1.apk

      - name: Upload Elya APK
        uses: actions/upload-artifact@v4
        with:
          name: Elya-APK-1.0.1
          path: Elya-1.0.1.apk
          if-no-files-found: error
          retention-days: 30
